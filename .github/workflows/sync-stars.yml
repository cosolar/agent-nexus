name: 每周星数刷新

on:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stars
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 重新抽取结构化数据
        run: node scripts/extract.mjs

      - name: 刷新星数并回写
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-stars.mjs --write

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/projects.json
          if git diff --cached --quiet; then
            echo "本次无星数变化，跳过提交"
          else
            git commit -m "chore: 自动刷新星数 ($(date -u +%Y-%m-%d))"
            git push
          fi
